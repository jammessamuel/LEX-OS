name: lex-os

x-runtime-environment: &runtime-environment
  NODE_ENV: development
  CASE_ARCHIVE: fictional
  API_PORT: 3000
  DEPENDENCY_TIMEOUT_MS: ${DEPENDENCY_TIMEOUT_MS:?DEPENDENCY_TIMEOUT_MS is required}
  LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
  WORKER_READY_FILE: /tmp/lex-os-worker-ready
  WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
  AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?AUTH_ACCESS_TOKEN_SECRET is required}
  SECOND_FACTOR_ENCRYPTION_KEY: ${SECOND_FACTOR_ENCRYPTION_KEY:?SECOND_FACTOR_ENCRYPTION_KEY is required}
  AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:?AUTH_ACCESS_TOKEN_TTL_SECONDS is required}
  AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:?AUTH_REFRESH_TOKEN_TTL_SECONDS is required}
  AUTH_LOGIN_ATTEMPT_LIMIT: ${AUTH_LOGIN_ATTEMPT_LIMIT:?AUTH_LOGIN_ATTEMPT_LIMIT is required}
  AUTH_LOGIN_ATTEMPT_WINDOW_SECONDS: ${AUTH_LOGIN_ATTEMPT_WINDOW_SECONDS:?AUTH_LOGIN_ATTEMPT_WINDOW_SECONDS is required}
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
  DATABASE_USER: ${DATABASE_USER:?DATABASE_USER is required}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
  DATABASE_SSL: 'false'
  REDIS_HOST: redis
  # Dentro da rede do Compose o Mailpit atende pelo nome do servico, nao por 127.0.0.1.
  MAIL_HOST: mailpit
  MAIL_PORT: '1025'
  MAIL_FROM: ${MAIL_FROM:-nao-responda@lexos.invalid}
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  PROCESSING_QUEUE_PREFIX: ${PROCESSING_QUEUE_PREFIX:?PROCESSING_QUEUE_PREFIX is required}
  PROCESSING_JOB_ATTEMPTS: ${PROCESSING_JOB_ATTEMPTS:?PROCESSING_JOB_ATTEMPTS is required}
  PROCESSING_JOB_BACKOFF_MS: ${PROCESSING_JOB_BACKOFF_MS:?PROCESSING_JOB_BACKOFF_MS is required}
  PROCESSING_WORKER_CONCURRENCY: ${PROCESSING_WORKER_CONCURRENCY:?PROCESSING_WORKER_CONCURRENCY is required}
  PROCESSING_STALE_AFTER_SECONDS: ${PROCESSING_STALE_AFTER_SECONDS:?PROCESSING_STALE_AFTER_SECONDS is required}
  PROCESSING_RECONCILE_INTERVAL_SECONDS: ${PROCESSING_RECONCILE_INTERVAL_SECONDS:?PROCESSING_RECONCILE_INTERVAL_SECONDS is required}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:${MINIO_API_PORT:-9000}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?OBJECT_STORAGE_REGION is required}
  OBJECT_STORAGE_USE_SSL: 'false'
  OBJECT_STORAGE_DOWNLOAD_URL_TTL_SECONDS: ${OBJECT_STORAGE_DOWNLOAD_URL_TTL_SECONDS:?OBJECT_STORAGE_DOWNLOAD_URL_TTL_SECONDS is required}
  OBJECT_STORAGE_QUARANTINE_STALE_AFTER_SECONDS: ${OBJECT_STORAGE_QUARANTINE_STALE_AFTER_SECONDS:?OBJECT_STORAGE_QUARANTINE_STALE_AFTER_SECONDS is required}
  FILE_INTAKE_MAX_FILE_BYTES: ${FILE_INTAKE_MAX_FILE_BYTES:?FILE_INTAKE_MAX_FILE_BYTES is required}
  FILE_INTAKE_MAX_FILES_PER_REQUEST: ${FILE_INTAKE_MAX_FILES_PER_REQUEST:?FILE_INTAKE_MAX_FILES_PER_REQUEST is required}
  FILE_INTAKE_ALLOWED_MIME_TYPES: ${FILE_INTAKE_ALLOWED_MIME_TYPES:?FILE_INTAKE_ALLOWED_MIME_TYPES is required}

x-application-build: &application-build
  context: .
  dockerfile: infra/docker/Dockerfile
  args:
    VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    ports:
      - '127.0.0.1:${POSTGRES_DOCKER_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:8.8.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - '127.0.0.1:${REDIS_DOCKER_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      MINIO_REGION_NAME: ${OBJECT_STORAGE_REGION:?OBJECT_STORAGE_REGION is required}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      MINIO_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        mc anonymous set none "local/$$MINIO_BUCKET"
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend

  api:
    build:
      <<: *application-build
      target: api
    restart: unless-stopped
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--output-document=/dev/null',
          'http://127.0.0.1:3000/api/v1/health/ready',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  worker:
    build:
      <<: *application-build
      target: worker
    restart: unless-stopped
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/lex-os-worker-ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  web:
    build:
      <<: *application-build
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--output-document=/dev/null', 'http://127.0.0.1:5173/']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - frontend

networks:
  backend:
  frontend:

volumes:
  minio_data:
  postgres_data:
  redis_data:
