name: CI

on:
  push:
    branches: [main]
  pull_request:

# A CI apenas verifica: não implanta, publica nem acessa ambientes reais.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.0'
  PNPM_VERSION: '11.9.0'

jobs:
  quality:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # O `prisma validate` exige a fonte de dados definida, mas não abre conexão nesta etapa.
      DATABASE_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:5433/postgres?schema=public
      DEPENDENCY_TIMEOUT_MS: '2000'
      LOG_LEVEL: info
      WEB_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      AUTH_ACCESS_TOKEN_SECRET: ci-access-token-secret-000000000000
      AUTH_ACCESS_TOKEN_TTL_SECONDS: '900'
      AUTH_REFRESH_TOKEN_TTL_SECONDS: '2592000'
      AUTH_LOGIN_ATTEMPT_LIMIT: '5'
      AUTH_LOGIN_ATTEMPT_WINDOW_SECONDS: '900'
      DATABASE_NAME: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      PROCESSING_QUEUE_PREFIX: lex-os
      PROCESSING_JOB_ATTEMPTS: '3'
      PROCESSING_JOB_BACKOFF_MS: '250'
      PROCESSING_WORKER_CONCURRENCY: '2'
      PROCESSING_STALE_AFTER_SECONDS: '60'
      PROCESSING_RECONCILE_INTERVAL_SECONDS: '30'
      OBJECT_STORAGE_BUCKET: lex-os-private
      OBJECT_STORAGE_ACCESS_KEY: ci-minio-access-key
      OBJECT_STORAGE_SECRET_KEY: ci-minio-secret-key
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_DOWNLOAD_URL_TTL_SECONDS: '60'
      OBJECT_STORAGE_QUARANTINE_STALE_AFTER_SECONDS: '3600'
      FILE_INTAKE_MAX_FILE_BYTES: '26214400'
      FILE_INTAKE_MAX_FILES_PER_REQUEST: '10'
      FILE_INTAKE_ALLOWED_MIME_TYPES: application/pdf,image/jpeg,image/png,text/plain
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database schema and migration validation
        run: pnpm db:validate

      - name: Build
        run: pnpm build

      - name: Compose configuration
        run: pnpm infra:config

      - name: Build application containers
        run: docker compose build api worker web

  commit-message-guard:
    name: Commit message guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the guard hooks
        run: bash .githooks/test-commit-msg-guard.sh

      - name: Reject AI attribution in this branch's commits
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! sh .githooks/commit-msg /tmp/msg; then
              echo "  ^ offending commit: $sha"
              failed=1
            fi
          done <<< "$(git rev-list "$base".."$head")"
          exit "$failed"

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Os testes de integração carregam `.env`; estes valores são exclusivos da CI e
      # correspondem aos padrões do Compose, sem depender de segredos externos.
      - name: Create CI environment file
        run: |
          sed \
            -e 's|replace-with-at-least-32-random-characters|ci-access-token-secret-000000000000|g' \
            -e 's|replace-with-local-admin-password|ci-seed-admin-password|g' \
            -e 's|replace-with-local-redis-password|ci-redis-password|g' \
            -e 's|replace-with-local-access-key|ci-minio-access-key|g' \
            -e 's|replace-with-local-secret-key|ci-minio-secret-key|g' \
            -e 's|replace-with-local-password|ci-postgres-password|g' \
            .env.example > .env
          if grep -q 'replace-with' .env; then
            echo 'A placeholder survived substitution.' >&2
            grep -n 'replace-with' .env >&2
            exit 1
          fi

      # A CI usa o mesmo Compose local para impedir divergência entre os ambientes.
      - name: Start dependencies
        run: pnpm infra:dependencies

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Migration status
        run: pnpm db:migrate:status

      - name: Seed fictional data
        run: pnpm db:seed

      - name: Integration tests
        run: pnpm test:integration

      - name: Backup and restore rehearsal
        run: node infra/scripts/backup-restore-rehearsal.mjs

      - name: Dependency logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop dependencies
        if: always()
        run: docker compose down --volumes

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create CI environment file
        run: |
          sed \
            -e 's|replace-with-at-least-32-random-characters|ci-access-token-secret-000000000000|g' \
            -e 's|replace-with-local-admin-password|ci-seed-admin-password|g' \
            -e 's|replace-with-local-redis-password|ci-redis-password|g' \
            -e 's|replace-with-local-access-key|ci-minio-access-key|g' \
            -e 's|replace-with-local-secret-key|ci-minio-secret-key|g' \
            -e 's|replace-with-local-password|ci-postgres-password|g' \
            .env.example > .env
          if grep -q 'replace-with' .env; then
            echo 'A placeholder survived substitution.' >&2
            grep -n 'replace-with' .env >&2
            exit 1
          fi

      # A mesma stack Compose do desenvolvimento local: web, API, worker e dependências,
      # com health checks. O E2E exercita o produto pelo mesmo caminho do usuário.
      - name: Start complete stack
        run: pnpm infra:up

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Seed fictional data
        run: pnpm db:seed

      - name: Restart applications on the migrated schema
        run: docker compose restart api worker

      - name: Install Playwright browsers
        run: pnpm --filter @lex-os/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          SEED_ADMIN_PASSWORD: ci-seed-admin-password
          E2E_BASE_URL: http://localhost:5173
        run: pnpm test:e2e

      - name: Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: apps/web/test-results/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Em pull request, o GitHub compara as dependências alteradas com o banco de
      # vulnerabilidades; em push, a auditoria do lockfile cobre o estado inteiro.
      - name: Review changed dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
