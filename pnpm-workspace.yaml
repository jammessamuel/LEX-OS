packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  'argon2@0.45.1': true
  'esbuild@0.28.1': true
  msgpackr-extract: false
  prisma: true
  'unrs-resolver@1.12.2': true

autoInstallPeers: false

# Correções de advisories em dependências transitivas; remover quando os pais atualizarem.
overrides:
  'mysql2@<3.23.1': '>=3.23.1'
  'qs@<6.16.0': '>=6.16.0'
  'fast-uri@<3.1.6': '>=3.1.6'
  'nanoid@<3.3.18': '>=3.3.18 <4'
  'js-yaml@>=5.0.0 <5.2.2': '>=5.2.2'
  'deepmerge-ts@<8': '>=8'

engineStrict: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@nestjs/jwt@11.0.2'
  - '@nestjs/swagger@11.4.6'
  - '@nestjs/throttler@6.5.0'
  - '@prisma/adapter-pg@7.9.1'
  - '@prisma/client@7.9.1'
  - '@types/cookie-parser@1.4.10'
  - '@types/pg@8.20.4'
  - '@types/supertest@7.2.1'
  - 'argon2@0.45.1'
  - 'class-transformer@0.5.1'
  - 'class-validator@0.15.1'
  - 'cookie-parser@1.4.7'
  - 'helmet@8.3.0'
  - 'prisma@7.9.1'
  - 'react-dom@19.2.8'
  - 'react@19.2.8'
  - 'supertest@7.2.2'
  - '@aws-sdk/checksums@3.1000.26'
  - '@aws-sdk/client-s3@3.1103.0'
  - '@aws-sdk/core@3.977.6'
  - '@aws-sdk/credential-provider-env@3.972.67'
  - '@aws-sdk/credential-provider-http@3.972.69'
  - '@aws-sdk/credential-provider-ini@3.973.12'
  - '@aws-sdk/credential-provider-login@3.972.74'
  - '@aws-sdk/credential-provider-node@3.972.78'
  - '@aws-sdk/credential-provider-process@3.972.67'
  - '@aws-sdk/credential-provider-sso@3.973.11'
  - '@aws-sdk/credential-provider-web-identity@3.972.73'
  - '@aws-sdk/lib-storage@3.1103.0'
  - '@aws-sdk/middleware-sdk-s3@3.972.72'
  - '@aws-sdk/nested-clients@3.997.41'
  - '@aws-sdk/s3-request-presigner@3.1103.0'
  - '@aws-sdk/token-providers@3.1103.0'

saveExact: true

strictDepBuilds: true

strictPeerDependencies: true
